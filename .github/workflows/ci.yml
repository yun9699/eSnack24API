name: Java CI with Gradle

on:
  push:
    branches: [ "subMain" ]
  pull_request:
    branches: [ "subMain" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create .env file
        run: |
          echo "PAYPAL_ID=${{ secrets.PAYPAL_ID }}" > .env 
          echo "PAYPAL_SECRET=${{ secrets.PAYPAL_SECRET }}" >> .env 

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Log in to Docker Hub
        run:
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin


      - name: Build the Docker image
        run: docker build -t "${{ secrets.DOCKER_USERNAME }}"/carebridgeadmin:latest .

      - name: Push the Docker image to Docker Hub
        run: docker push "${{ secrets.DOCKER_USERNAME }}"/carebridgeadmin:latest

